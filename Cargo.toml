[package]
name = "pro-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Rust desktop client for long-running LLM reasoning with OpenAI, Gemini and Claude"
license = "MIT"
repository = "https://github.com/zubus/pro-gui"

[dependencies]
anyhow = "1.0"
arboard = "3"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
eframe = { version = "0.33", features = ["persistence"] }
egui = "0.33"
ignore = "0.4.28"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
regex = "1.13.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.15"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiktoken-rs = "0.12.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
